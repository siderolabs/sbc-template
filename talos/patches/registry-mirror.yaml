# Pull ghcr.io (installers, overlay, Talos images) and docker.io through the
# management node's caches (mgmt/compose.yaml). Talos falls back to the upstream
# registry when the management node is unreachable (no skipFallback).
apiVersion: v1alpha1
kind: RegistryMirrorConfig
name: ghcr.io
endpoints:
  - url: http://10.20.0.5:5003
---
apiVersion: v1alpha1
kind: RegistryMirrorConfig
name: docker.io
endpoints:
  - url: http://10.20.0.5:5000
