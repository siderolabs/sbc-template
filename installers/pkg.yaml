name: sbc-quartz
variant: scratch
shell: /toolchain/bin/bash
dependencies:
  - stage: quartz64-installers
  - stage: profiles
  - stage: u-boot-quartz64
    platform: linux/arm64
  # All Rockchip DTBs from the kernel Talos actually boots (PKGS, set
  # per Talos release), so a new baseboard only needs a Pkgfile board entry.
  - image: "{{ .BUILD_ARG_PKGS_PREFIX }}/kernel:{{ .BUILD_ARG_PKGS }}"
    platform: linux/arm64
    from: /dtb/rockchip
    to: /rootfs/artifacts/arm64/dtb/rockchip
finalize:
  - from: /rootfs
    to: /
