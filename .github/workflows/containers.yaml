# Builds the FFmpeg V4L2 Request images (arm64) used with the "media" kernel flavor.
name: containers
on:
  push:
    branches: [main]
    paths: ["containers/**", ".github/workflows/containers.yaml"]
  schedule:
    - cron: "41 10 * * 1"     # weekly: pick up new Scrypted base images
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: scrypted-rk3566
            base: ghcr.io/koush/scrypted:latest
          - name: ffmpeg-v4l2request
            base: debian:trixie-slim
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          docker buildx build containers/ffmpeg-v4l2request \
            --platform linux/arm64 \
            --build-arg BASE_IMAGE=${{ matrix.base }} \
            --tag ghcr.io/${owner}/${{ matrix.name }}:latest \
            --tag ghcr.io/${owner}/${{ matrix.name }}:$(date -u +%Y%m%d) \
            --push
