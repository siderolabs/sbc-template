# PR check: build the overlay (arm64 half, native runner) without pushing.
# Releases are built by images.yaml.
name: ci
on:
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: docker/setup-buildx-action@v3
      - run: make docker-sbc-quartz PLATFORM=linux/arm64
