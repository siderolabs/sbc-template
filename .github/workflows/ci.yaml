# PR checks only. Nothing is pushed or uploaded (no durable artifacts);
# releases come from images.yaml after merge.
name: ci
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Seconds. Always runs: syntax of workflows, YAML, shell and Python.
  lint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: YAML parses
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in glob.glob(".github/workflows/*.yaml") + glob.glob("talos/**/*.yaml", recursive=True) + glob.glob("zero/*.yaml*") + glob.glob("profiles/**/*.yaml", recursive=True):
              try:
                  list(yaml.safe_load_all(open(f)))
              except Exception as e:
                  print(f"::error file={f}::{e}"); bad = 1
          sys.exit(bad)
          PY
      - name: Shell and Python syntax
        run: |
          for f in hack/*.sh; do bash -n "$f"; done
          python3 -m py_compile hack/zboot-extract.py zero/install-image-guard.py
      - name: No *.tmpl files (bldr would load them)
        run: |
          if git ls-files '*.tmpl' | grep -q .; then git ls-files '*.tmpl'; echo "::error::rename *.tmpl files"; exit 1; fi

  changes:
    runs-on: ubuntu-24.04-arm
    outputs:
      overlay: ${{ steps.f.outputs.overlay }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: f
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "${base}" HEAD | grep -qE '^(Pkgfile|Makefile|\.dockerignore|go\.work|artifacts/|installers/|internal/|profiles/)'; then
            echo "overlay=true" >> "$GITHUB_OUTPUT"
          else
            echo "overlay=false" >> "$GITHUB_OUTPUT"
          fi

  # Minutes (U-Boot x5, TF-A, installer). Only when the overlay inputs change.
  overlay-build:
    needs: changes
    if: needs.changes.outputs.overlay == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: docker/setup-buildx-action@v4
      - name: Build overlay (arm64, not pushed)
        run: make target-sbc-quartz PLATFORM=linux/arm64
