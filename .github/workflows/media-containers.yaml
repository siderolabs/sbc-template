# Userspace half of the "media" flavor. Separate from images.yaml on purpose:
# these images don't depend on the Talos version, only on FFmpeg and the
# Scrypted base, so they rebuild when containers/ changes or a base image
# moves (decided by track.yaml).
#
#   media-kernel.yaml    kernel side: Hantro/RGA modules -> /dev/video*, /dev/media* on media nodes
#   media-containers.yaml (this) userspace side: FFmpeg 8.1 + V4L2 Request hwaccel that uses them
#     ghcr.io/<owner>/scrypted-rk3566      Scrypted + /opt/ffmpeg-v4l2request/bin/ffmpeg
#     ghcr.io/<owner>/ffmpeg-v4l2request   same FFmpeg on Debian, for other apps / testing
name: media-containers
# Started by track.yaml when the Dockerfile changed or a base image has a new
# digest (it compares against the labels set below). Can also be run by hand.
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: scrypted-rk3566
            base: ghcr.io/koush/scrypted:latest
          - name: ffmpeg-v4l2request
            base: debian:trixie-slim
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          set -euo pipefail
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          base_digest="$(docker buildx imagetools inspect "${{ matrix.base }}" --format '{{json .Manifest}}' | jq -r .digest)"
          docker buildx build containers/ffmpeg-v4l2request \
            --platform linux/arm64 \
            --build-arg BASE_IMAGE="${{ matrix.base }}@${base_digest}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label org.opencontainers.image.base.name="${{ matrix.base }}" \
            --label org.opencontainers.image.base.digest="${base_digest}" \
            --tag "ghcr.io/${owner}/${{ matrix.name }}:latest" \
            --tag "ghcr.io/${owner}/${{ matrix.name }}:$(date -u +%Y%m%d)" \
            --push

  report:
    needs: build
    if: failure()
    runs-on: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          set -euo pipefail
          body="media-containers failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (${GITHUB_EVENT_NAME}, ${GITHUB_SHA::7}). Close once a run is green."
          gh label create build-failure --color D93F0B --description "Unattended build failed" --force
          n="$(gh issue list --label build-failure --state open --search 'media-containers in:title' --json number --jq '.[0].number // empty')"
          if [ -n "$n" ]; then gh issue comment "$n" --body "${body}"
          else gh issue create --label build-failure --title "media-containers: build failing" --body "${body}"; fi
