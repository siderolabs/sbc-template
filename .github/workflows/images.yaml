# Builds the overlay, then Talos SD/eMMC images + upgrade installers for each
# board, in two flavors:
#   stock  - Talos kernel as released (+ official drbd)
#   media  - same mainline kernel + Hantro/RGA (media-kernel.yaml), drbd rebuilt for it
# and publishes a GitHub Release named after the git tag. A media failure never
# blocks the stock images.
#
# Tags follow upstream Talos: v1.14.5 is the first build for Talos v1.14.5,
# v1.14.5-r1, -r2 ... are rebuilds of the same Talos with fixes from this repo.
# track.yaml creates those tags and dispatches this workflow on them, so a
# normal run needs no human. Pushing a v* tag by hand works the same way.
# Running it by hand on a branch builds and uploads workflow artifacts (7 days)
# without publishing a release.
name: images
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      talos_version:
        description: "Talos version override. Empty = talos.env at this ref (normal)"
        required: false
      media:
        description: "Also build the media (Hantro) flavor. First run builds the kernel: several hours"
        type: boolean
        default: true
      netboot:
        description: "Also build the PXE/TFTP netboot tree"
        type: boolean
        default: false
      force:
        description: "Rebuild even if this tag already has a release"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  issues: write
  id-token: write      # keyless cosign signatures (GitHub OIDC identity)

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  resolve:
    runs-on: ubuntu-24.04-arm
    outputs:
      talos: ${{ steps.v.outputs.talos }}
      pkgs: ${{ steps.v.outputs.pkgs }}
      overlay_tag: ${{ steps.v.outputs.overlay_tag }}
      release_tag: ${{ steps.v.outputs.release_tag }}
      skip: ${{ steps.v.outputs.skip }}
      owner: ${{ steps.v.outputs.owner }}
      media: ${{ steps.v.outputs.media }}
      netboot: ${{ steps.v.outputs.netboot }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ inputs.talos_version }}
          FORCE: ${{ inputs.force }}
          MEDIA: ${{ github.event_name == 'workflow_dispatch' && inputs.media || github.event_name != 'workflow_dispatch' }}
          NETBOOT: ${{ github.event_name == 'workflow_dispatch' && inputs.netboot }}
        run: |
          set -euo pipefail
          . ./talos.env
          talos="${INPUT:-${TALOS_VERSION}}"
          if [ "${talos}" = "${TALOS_VERSION}" ]; then
            pkgs="${PKGS}"
          else
            # older release requested by hand: use the kernel pkgs that release pinned
            pkgs="$(curl -fsSL "https://raw.githubusercontent.com/siderolabs/talos/${talos}/Makefile" \
                    | sed -nE 's/^PKGS \?= *(.*)$/\1/p' | head -n1)"
          fi
          [ -n "${pkgs}" ] || { echo "::error::could not find PKGS for ${talos}"; exit 1; }
          release_tag=""; skip=false
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            release_tag="${GITHUB_REF_NAME}"; overlay_tag="${GITHUB_REF_NAME}"
            case "${release_tag}" in
              "${talos}"|"${talos}"-r[0-9]*) ;;
              *) [ -n "${INPUT}" ] || { echo "::error::tag ${release_tag} doesn't match talos.env ${talos}"; exit 1; } ;;
            esac
            if [ "${FORCE}" != true ] && gh release view "${release_tag}" >/dev/null 2>&1; then skip=true; fi
          else
            overlay_tag="${talos}-$(git rev-parse --short HEAD)"
          fi
          {
            echo "talos=${talos}"; echo "pkgs=${pkgs}"
            echo "overlay_tag=${overlay_tag}"; echo "release_tag=${release_tag}"
            echo "skip=${skip}"; echo "owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
            echo "media=${MEDIA}"; echo "netboot=${NETBOOT:-false}"
          } | tee -a "$GITHUB_OUTPUT"

  overlay:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: docker/setup-qemu-action@v4      # amd64 half of the overlay (installer binaries only)
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: "${{ env.REGISTRY }}", username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build and push overlay
        run: |
          make docker-sbc-quartz \
            PLATFORM=linux/arm64,linux/amd64 \
            PKGS="${{ needs.resolve.outputs.pkgs }}" \
            TARGET_ARGS="--tag=${REGISTRY}/${{ needs.resolve.outputs.owner }}/sbc-quartz:${{ needs.resolve.outputs.overlay_tag }} --push=true"

  media-kernel:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true' && needs.resolve.outputs.media == 'true'
    uses: ./.github/workflows/media-kernel.yaml
    with:
      talos: ${{ needs.resolve.outputs.talos }}
      pkgs: ${{ needs.resolve.outputs.pkgs }}
    secrets: inherit

  # Groundwork for a self-hosted Image Factory: official overlay catalog + our
  # boards as ghcr.io/<owner>/overlays:<talos>, overlay + catalog signed. Never blocks.
  catalog:
    needs: [resolve, overlay]
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: "${{ env.REGISTRY }}", username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: sigstore/cosign-installer@v4.1.3
      - uses: imjasonh/setup-crane@v0.7
      - name: Sign overlay, publish catalog
        env:
          OWNER: ${{ needs.resolve.outputs.owner }}
          TALOS: ${{ needs.resolve.outputs.talos }}
          OVERLAY_TAG: ${{ needs.resolve.outputs.overlay_tag }}
        run: |
          set -euo pipefail
          overlay="${REGISTRY}/${OWNER}/sbc-quartz"
          digest="$(crane digest "${overlay}:${OVERLAY_TAG}")"
          cosign sign --yes "${overlay}@${digest}"
          mkdir -p cat && cd cat
          crane export "ghcr.io/siderolabs/overlays:${TALOS}" - | tar x overlays.yaml 2>/dev/null || echo "overlays: []" > overlays.yaml
          python3 -m pip install --quiet --break-system-packages pyyaml 2>/dev/null || true
          OVERLAY="${overlay}:${OVERLAY_TAG}" DIGEST="${digest}" python3 - <<'PY2'
          import os, re, yaml
          cat = yaml.safe_load(open("overlays.yaml")) or {}
          cat.setdefault("overlays", [])
          boards = re.findall(r"^    ([a-z0-9-]+):", open("../Pkgfile").read(), re.M)
          names = {o["name"] for o in cat["overlays"]}
          for b in boards:
              if b not in names:
                  cat["overlays"].append({"name": b, "image": os.environ["OVERLAY"], "digest": os.environ["DIGEST"]})
          yaml.safe_dump(cat, open("overlays.yaml", "w"), sort_keys=False)
          print(open("overlays.yaml").read())
          PY2
          printf 'FROM scratch\nCOPY overlays.yaml /overlays.yaml\n' > Dockerfile
          docker buildx build . --platform linux/arm64,linux/amd64 --tag "${REGISTRY}/${OWNER}/overlays:${TALOS}" --push
          cosign sign --yes "${REGISTRY}/${OWNER}/overlays@$(crane digest "${REGISTRY}/${OWNER}/overlays:${TALOS}")"

  images:
    name: images (stock)
    needs: [resolve, overlay]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        board: [quartz64-a, soquartz-blade, soquartz-model-a]
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: docker/login-action@v4
        with: { registry: "${{ env.REGISTRY }}", username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build, verify, push installer
        env:
          TALOS_VERSION: ${{ needs.resolve.outputs.talos }}
          FLAVOR: stock
          EXTENSIONS: drbd
          OVERLAY_IMAGE: ${{ env.REGISTRY }}/${{ needs.resolve.outputs.owner }}/sbc-quartz:${{ needs.resolve.outputs.overlay_tag }}
          INSTALLER_REPO: ${{ env.REGISTRY }}/${{ needs.resolve.outputs.owner }}/talos-installer
        run: |
          if [ "${{ needs.resolve.outputs.netboot }}" = true ] && [ "${{ matrix.board }}" = quartz64-a ]; then export NETBOOT=1; fi
          bash hack/build-image.sh "${{ matrix.board }}"
      - uses: sigstore/cosign-installer@v4.1.3
      - name: Sign installer (keyless)
        continue-on-error: true
        run: |
          ref="${REGISTRY}/${{ needs.resolve.outputs.owner }}/talos-installer-${{ matrix.board }}:${{ needs.resolve.outputs.talos }}"
          digest="$(docker buildx imagetools inspect "${ref}" --format '{{json .Manifest}}' | jq -r .digest)"
          cosign sign --yes "${ref%:*}@${digest}"
      - name: Checksums
        run: cd _out && for f in *.raw.xz *.tar.gz; do [ -e "$f" ] && sha256sum "$f" > "$f.sha256"; done; ls -la
      - uses: actions/upload-artifact@v7
        with:
          name: image-stock-${{ matrix.board }}
          path: |
            _out/*.raw.xz
            _out/*.tar.gz
            _out/*.sha256
          retention-days: 7

  images-media:
    name: images (media, Hantro)
    needs: [resolve, overlay, media-kernel]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        board: [quartz64-a, soquartz-blade, soquartz-model-a]
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: docker/login-action@v4
        with: { registry: "${{ env.REGISTRY }}", username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build, verify, push installer
        env:
          TALOS_VERSION: ${{ needs.resolve.outputs.talos }}
          FLAVOR: media
          OVERLAY_IMAGE: ${{ env.REGISTRY }}/${{ needs.resolve.outputs.owner }}/sbc-quartz:${{ needs.resolve.outputs.overlay_tag }}
          INSTALLER_REPO: ${{ env.REGISTRY }}/${{ needs.resolve.outputs.owner }}/talos-installer
          IMAGER_IMAGE: ${{ env.REGISTRY }}/${{ needs.resolve.outputs.owner }}/talos-media/imager:${{ needs.resolve.outputs.talos }}
          BASE_INSTALLER_IMAGE: ${{ env.REGISTRY }}/${{ needs.resolve.outputs.owner }}/talos-media/installer-base:${{ needs.resolve.outputs.talos }}
          EXTENSION_IMAGES: ${{ env.REGISTRY }}/${{ needs.resolve.outputs.owner }}/talos-media/drbd:${{ needs.resolve.outputs.talos }}
        run: |
          if [ "${{ needs.resolve.outputs.netboot }}" = true ] && [ "${{ matrix.board }}" = quartz64-a ]; then export NETBOOT=1; fi
          bash hack/build-image.sh "${{ matrix.board }}"
      - uses: sigstore/cosign-installer@v4.1.3
      - name: Sign installer (keyless)
        continue-on-error: true
        run: |
          ref="${REGISTRY}/${{ needs.resolve.outputs.owner }}/talos-installer-${{ matrix.board }}-media:${{ needs.resolve.outputs.talos }}"
          digest="$(docker buildx imagetools inspect "${ref}" --format '{{json .Manifest}}' | jq -r .digest)"
          cosign sign --yes "${ref%:*}@${digest}"
      - name: Checksums
        run: cd _out && for f in *.raw.xz *.tar.gz; do [ -e "$f" ] && sha256sum "$f" > "$f.sha256"; done; ls -la
      - uses: actions/upload-artifact@v7
        with:
          name: image-media-${{ matrix.board }}
          path: |
            _out/*.raw.xz
            _out/*.tar.gz
            _out/*.sha256
          retention-days: 7

  release:
    needs: [resolve, images, images-media]
    # stock must succeed; media is included when it built
    if: always() && needs.images.result == 'success' && needs.resolve.outputs.release_tag != ''
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: Notes
        env:
          MEDIA_RESULT: ${{ needs.images-media.result }}
        run: |
          o=${{ needs.resolve.outputs.owner }}; t=${{ needs.resolve.outputs.talos }}
          cat > notes.md <<NOTES
          Talos **${t}** for Pine64 RK3566 boards. Overlay \`${REGISTRY}/${o}/sbc-quartz:${{ needs.resolve.outputs.overlay_tag }}\`,
          kernel pkgs \`${{ needs.resolve.outputs.pkgs }}\`. Media flavor (Hantro decode): **${MEDIA_RESULT}**.

          | board | stock image | media image | upgrade installers |
          |---|---|---|---|
          | Quartz64 Model A | \`talos-${t}-quartz64-a.raw.xz\` | \`talos-${t}-quartz64-a-media.raw.xz\` | \`${REGISTRY}/${o}/talos-installer-quartz64-a[-media]:${t}\` |
          | SOQuartz + Blade | \`talos-${t}-soquartz-blade.raw.xz\` | \`talos-${t}-soquartz-blade-media.raw.xz\` | \`${REGISTRY}/${o}/talos-installer-soquartz-blade[-media]:${t}\` |
          | SOQuartz + Model-A | \`talos-${t}-soquartz-model-a.raw.xz\` | \`talos-${t}-soquartz-model-a-media.raw.xz\` | \`${REGISTRY}/${o}/talos-installer-soquartz-model-a[-media]:${t}\` |

          Flash: \`xz -dc <image> | sudo dd of=/dev/rdiskN bs=4m\`. Serial: UART2, 1500000 8N1. Bring-up: docs/bring-up.md.
          NOTES
          ls -la dist
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.release_tag }}
          name: ${{ needs.resolve.outputs.release_tag }} (Talos ${{ needs.resolve.outputs.talos }})
          body_path: notes.md
          files: dist/*

  # Unattended runs (push/dispatch from track.yaml) report failures as an issue
  # instead of relying on someone reading the Actions tab. The media flavor is
  # optional, so its failure is reported too, without failing the release.
  report:
    needs: [resolve, overlay, media-kernel, images, images-media, release]
    if: always() && github.ref_type == 'tag' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          title="images: ${GITHUB_REF_NAME} failed"
          body="$(printf 'Run: %s (%s on %s)\n\n| job | result |\n|---|---|\n| resolve | %s |\n| overlay | %s |\n| media-kernel | %s |\n| images (stock) | %s |\n| images-media | %s |\n| release | %s |\n\nFix on main: the tracker tags the fix as the next -rN and rebuilds. Close this once that release is out.' \
            "${run_url}" "${GITHUB_EVENT_NAME}" "${GITHUB_SHA::7}" \
            "${{ needs.resolve.result }}" "${{ needs.overlay.result }}" "${{ needs.media-kernel.result }}" \
            "${{ needs.images.result }}" "${{ needs.images-media.result }}" "${{ needs.release.result }}")"
          gh label create build-failure --color D93F0B --description "Unattended build failed" --force
          n="$(gh issue list --label build-failure --state open --search 'images: in:title' --json number --jq '.[0].number // empty')"
          if [ -n "$n" ]; then gh issue comment "$n" --body "${body}"
          else gh issue create --label build-failure --title "${title}" --body "${body}"; fi
