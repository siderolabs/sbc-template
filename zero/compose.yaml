# Pi Zero 2 W management box (outside the cluster), Raspberry Pi OS Lite 64-bit + Docker.
#   docker compose -f zero/compose.yaml up -d
# Pull-through caches (Talos docs: one registry:2 per upstream, one port each).
# Talos nodes use them via talos/patches/registry-mirror.yaml and fall back to
# the upstream registry if the Zero is down. Data lives on the Zero's USB disk.
services:
  cache-ghcr:
    image: registry:2
    restart: unless-stopped
    ports: ["5003:5000"]
    environment:
      REGISTRY_PROXY_REMOTEURL: https://ghcr.io
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      OTEL_TRACES_EXPORTER: none
    volumes: ["/mnt/usb/registry/ghcr:/var/lib/registry"]
  cache-docker:
    image: registry:2
    restart: unless-stopped
    ports: ["5000:5000"]
    environment:
      REGISTRY_PROXY_REMOTEURL: https://registry-1.docker.io
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      OTEL_TRACES_EXPORTER: none
    volumes: ["/mnt/usb/registry/docker:/var/lib/registry"]
